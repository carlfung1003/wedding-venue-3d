<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- two interlocked rings on a dark circle -->
  <circle cx="32" cy="32" r="30" fill="#16121c"/>
  <circle cx="26" cy="34" r="11" fill="none" stroke="#d8b46a" stroke-width="3.4"/>
  <circle cx="38" cy="30" r="11" fill="none" stroke="#f0e6d2" stroke-width="3.4"/>
  <!-- re-stroke an arc of the gold ring over the ivory one so they weave -->
